[project]
name = "orbit-secrets-observability-example"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "orbit-core>=0.1.0a1,<0.2",
  "orbit-testing>=0.1.0a1,<0.2",
  "orbit-secrets>=0.1.0a1,<0.2",
  "orbit-tracing>=0.1.0a1,<0.2",
  "orbit-logging>=0.1.0a1,<0.2",
  "orbit-logging-opentelemetry>=0.1.0a1,<0.2",
  "orbit-metrics-opentelemetry>=0.1.0a1,<0.2",
  "opentelemetry-sdk>=1.45,<2",
]

[project.optional-dependencies]
aws = ["orbit-secrets-aws>=0.1.0a1,<0.2", "opentelemetry-exporter-otlp-proto-http>=1.45,<2"]
gcp = ["orbit-secrets-gcp>=0.1.0a1,<0.2", "opentelemetry-exporter-otlp-proto-http>=1.45,<2"]
azure = ["orbit-secrets-azure>=0.1.0a1,<0.2", "opentelemetry-exporter-otlp-proto-http>=1.45,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
